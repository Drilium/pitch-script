name: Refresh Premier League data

on:
  schedule:
    # every day at 07:17 UTC (3:17am ET): picks up weekend, Monday and midweek results
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      backtest:
        description: "Re-run last season's backtest"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build soccer_data.json
        run: python build_data.py ${{ inputs.backtest && '--backtest' || '' }}
      - name: Commit if anything changed
        run: |
          git config user.name "pitch-script bot"
          git config user.email "actions@users.noreply.github.com"
          git add soccer_data.json cache/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
